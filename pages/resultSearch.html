<!doctype html>
<html lang="pt-BR">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;1,100;1,300;1,400;1,500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="../static/styles/dashboard.css">


  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6" crossorigin="anonymous">
  <link rel="shortcut icon" href="../static/images/icone.png">
  <title>PROGRAMOID</title>
  <style>
    .chart-container {
      position: relative;
      margin: -10px auto;
      width: 75vw;
    }
  </style>

  <!-- TITULO DA PÁGINA -->
  <link rel="shortcut icon" href="../images/icone.png">
  <title>Programoid - Análise do Eleitorado</title>
</head>

<body>

  <section id="container">

    <div class="sidebar">

      <a href="../pages/dashboard.html"><img src="../static/images/search.png" class="activea" alt=""></a><br>
      <a href="../pages/dowload.html"><img src="../static/images/dowload.png" class="activea" alt=""></a><br>
      <a href="../pages/index.html"><img src="../static/images/home.png" class="activea" alt=""></a><br>
      <a href="../pages/documentation.html"><img src="../static/images/engrenagem.png" class="activea" alt=""></a>
    </div>
    <section class="content">

      <div class="navbar">

        <form method="get" action="{{url_for('resultSearch')}}">
            <div class="select-wrap">
              <label for="cidade">Cidade</label>
              <select id="cidade" name="cidade" class="custom-select mr-sm-2">
                <option value="">SELECIONE A CIDADE</option>
                <option value="APARECIDA">APARECIDA</option>
                <option value="ARAPEÍ">ARAPEÍ</option>
                <option value="AREIAS">AREIAS</option>
                <option value="ATIBAIA">ATIBAIA</option>
                <option value="BRAGANÇA PAULISTA">BRAGANÇA PAULISTA</option>
                <option value="CAÇAPAVA">CAÇAPAVA</option>
                <option value="CACHOEIRA PAULISTA">CACHOEIRA PAULISTA</option>
                <option value="CAMPOS DO JORDÃO">CAMPOS DO JORDÃO</option>
                <option value="CARAGUATATUBA">CARAGUATATUBA</option>
                <option value="CRUZEIRO">CRUZEIRO</option>
                <option value="CUNHA">CUNHA</option>
                <option value="GUARATINGUETÁ">GUARATINGUETÁ</option>
                <option value="IGARATÁ">IGARATÁ</option>
                <option value="ILHABELA">ILHABELA</option>
                <option value="JOANÓPOLIS">JOANÓPOLIS</option>
                <option value="LORENA">LORENA</option>
                <option value="NATIVIDADE DA SERRA">NATIVIDADE DA SERRA</option>
                <option value="PARAIBUNA">PARAIBUNA</option>
                <option value="PINDAMONHANGABA">PINDAMONHANGABA</option>
                <option value="PIQUETE">PIQUETE</option>
                <option value="PIRACAIA">PIRACAIA</option>
                <option value="POTIM">POTIM</option>
                <option value="QUELUZ">QUELUZ</option>
                <option value="ROSEIRA">ROSEIRA</option>
                <option value="SANTA BRANCA">SANTA BRANCA</option>
                <option value="SANTO ANTÔNIO DO PINHAL">SANTO ANTÔNIO DO PINHAL</option>
                <option value="SÃO JOSÉ DOS CAMPOS">SÃO JOSÉ DOS CAMPOS</option>
                <option value="SÃO SEBASTIÃO">SÃO SEBASTIÃO</option>
                <option value="SILVEIRAS">SILVEIRAS</option>
                <option value="TAUBATÉ">TAUBATÉ</option>
                <option value="TREMEMBÉ">TREMEMBÉ</option>
                <option value="UBATUBA">UBATUBA</option>
              </select>
            </div>

            <div class="select-wrap">
              <label for="genero">Gênero</label>
              <select id="genero" name="genero" class="custom-select mr-sm-2">
                <option value="">SELECIONE O GÊNERO</option>
                <option value="MASCULINO">MASCULINO</option>
                <option value="FEMININO">FEMININO</option>
                <option value="NÃO INFORMADO">NÃO INFORMADO</option>
              </select>
            </div>

            <div class="select-wrap">
              <label for="estadoCivil">Estado Civil</label>
              <select id="estadoCivil" name="estadoCivil" class="custom-select mr-sm-2">
                <option value="">SELECIONE O ESTADO CIVIL</option>
                <option value="CASADO">CASADO</option>
                <option value="NÃO INFORMADO">NÃO INFORMADO</option>
                <option value="SEPARADO JUDICIALMENTE">SEPARADO JUDICIALMENTE</option>
                <option value="SOLTEIRO">SOLTEIRO</option>
                <option value="VIÚVO">VIÚVO</option>
              </select>
            </div>

            <div class="select-wrap">
              <label for="filtro">Filtro</label>
              <select id="filtro" name="filtro" required class="custom-select mr-sm-2">
                <option value="">SELECIONE O FILTRO</option>
                <option value="DS_GÊNERO">GÊNERO</option>
                <option value="DS_GRAU_ESCOLARIDADE">ESCOLARIDADE</option>
                <option value="5MAIORES">5 MAIORES CIDADES</option>
                <option value="POPIDOSO">ELEITORES ACIMA DOS 60</option>
                <option value="IDADES">IDADES</option>
              </select>
            </div>

            <div class="select-wrap">
              <label for="ano">Ano da Eleição</label>
              <select id="ano" name="ano" class="custom-select mr-sm-2">
                <option value="">SELECIONE O ANO</option>
                <option value="2022">2022</option>
                <option value="2018">2018</option>
              </select>
            </div>

            <div class="select-wrap">
              <label for="grafico">Tipo do Gráfico</label>
              <select id="grafico" name="grafico" class="custom-select mr-sm-2">
                <option value="bar">TIPO DO GRÁFICO</option>
                <option value="bar">BARRA</option>
                <option value="line">LINHA</option>
              </select>
            </div>

            <button class="buttonSearch" type="submit" >BUSCAR DADOS</button>
        </form>


        <div class="titulo">
          <div class="card" style="width: 18rem;">
            <div class="card-body">
              <h5 class="card-title">Total de Eleitores</h5>
              <span class="card-number">{{result['totalPessoas']}}</span>
            </div>
          </div>
        </div>



      </div>


      <div class="graphic">
        <span style="font-size:12px;text-align:center; margin-top: 5px;">* Caso nenhum ano seja selecionado, por padrão
          utilizaremos o ano mais recente</span>
        <div class="chart-container">
          <canvas class="line-chart"></canvas>
        </div>
        {% if result['qtdGenNaoInfo'] %}
        <span style="text-align:center;font-size: 20px; color: red;margin-top:-10px;">Quantidade de eleitores que não
          informaram: {{ result['qtdGenNaoInfo']}}</span>
        {% endif %}
      </div>
    </section>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.2.0/chart.min.js"></script>

  <script>
    var ctx = document.getElementsByClassName("line-chart")[0];

    // Verifica se existem dados antes de tentar renderizar o gráfico
    {% if result %}
    var chartGraph = new Chart(ctx, {
      type: '{{ result.get("tipoGrafico", "bar") }}',
      data: {
        labels: {{ result.get('eixoX', []) | tojson }},
    datasets: [{
      label: "Quantidade de Eleitores",
      data: {{ result.get('eixoY', []) | tojson }},
      borderWidth: 2,
      borderColor: [
      'rgba(255, 99, 132, 1)',
      'rgba(54, 162, 235, 1)',
      'rgba(255, 206, 86, 1)',
      'rgba(75, 192, 192, 1)',
      'rgba(153, 102, 255, 1)',
      'rgba(255, 159, 64, 1)'
    ],
      backgroundColor: [
      'rgba(255, 99, 132, 0.2)',
      'rgba(54, 162, 235, 0.2)',
      'rgba(255, 206, 86, 0.2)',
      'rgba(75, 192, 192, 0.2)',
      'rgba(153, 102, 255, 0.2)',
      'rgba(255, 159, 64, 0.2)'
    ],
        }]
      },
    options: {
      responsive: true,
        plugins: {
        title: {
          display: true,
            text: "{{ result.get('tituloGraph', '') }}",
              padding: {
            top: 10,
              bottom: 30
          },
          font: {
            weight: 'bold',
              size: 18
          }
        }
      }
    }
    });
    {% endif %}
  </script>


  <!-- Option 1: Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-JEW9xMcG8R+pH31jmWH6WWP0WintQrMb4s7ZOdauHnUtxwoG2vI5DkLtS3qm9Ekf"
    crossorigin="anonymous"></script>

</body>

</html>
